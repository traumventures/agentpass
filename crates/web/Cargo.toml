[package]
name = "agentpass-web"
description = "Yew web UI for agentpass passkey setup and unlock"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
agentpass-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "History", "HtmlInputElement", "HtmlSelectElement", "Storage", "Element", "ScrollIntoViewOptions", "ScrollLogicalPosition"] }
