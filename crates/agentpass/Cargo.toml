[package]
name = "agentpass"
description = "A passkey-unlocked password manager for AI agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["password-manager", "passkey", "webauthn", "secrets", "ai-agents"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "agentpass"
path = "src/main.rs"

[dependencies]
agentpass-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
anyhow = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive", "env"] }
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
axum = "0.8"
include_dir = "0.7"
mime_guess = "2"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
libc = "0.2"
ulid = "1"
humantime = "2"
rpassword = "7"
dirs = "5"
open = "5"
dialoguer = { version = "0.11", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
