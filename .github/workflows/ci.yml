name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail if crates/agentpass/ui is older than the web UI sources.
  AGENTPASS_REQUIRE_FRESH_UI: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p agentpass-web --target wasm32-unknown-unknown -- -D warnings
      - name: Unit and integration tests
        run: cargo test --workspace
      - name: Memory protection tests (root memory scans)
        if: runner.os == 'Linux'
        run: cargo test -p agentpass --test memory -- --ignored --nocapture
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 22
      - name: Skill installs into every agent (smoke test)
        if: runner.os == 'Linux'
        run: |
          cargo build -q -p agentpass
          home=$(mktemp -d)
          HOME=$home ./target/debug/agentpass init-skill --all --global --yes
          test -f "$home/.claude/skills/agentpass/SKILL.md"
      - name: cargo install from git
        if: runner.os == 'Linux' && github.event_name == 'push'
        run: cargo install --locked --git https://github.com/${{ github.repository }} --rev ${{ github.sha }} agentpass --root /tmp/ap && /tmp/ap/bin/agentpass --version
      - name: End-to-end tests (Chromium, virtual PRF authenticator)
        if: runner.os == 'Linux'
        run: |
          cargo build -p agentpass
          cd e2e
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
