[workspace]
resolver = "2"
members = ["crates/agentpass", "crates/protocol", "crates/web"]
default-members = ["crates/agentpass", "crates/protocol"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/traumventures/agentpass"
rust-version = "1.87"

[workspace.dependencies]
agentpass-protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-web]
inherits = "release"
opt-level = "z"
panic = "abort"
